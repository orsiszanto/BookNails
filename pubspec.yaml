name: booknails
description: "BookNails - nail salon booking application built with Flutter and Firebase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.21.0
  firebase_auth: ^4.11.0
  cloud_firestore: ^4.11.0

  # State management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.1

  # Routing
  go_router: ^12.0.0

  # UI & UX
  intl: ^0.19.0
  shimmer: ^3.0.0

  # Utilities
  equatable: ^2.0.5

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
